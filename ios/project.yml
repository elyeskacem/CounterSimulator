# Generate the Xcode project with:  xcodegen generate
# (the .xcodeproj is not committed; see ios/README.md)
name: MotoDash

options:
  bundleIdPrefix: com.elyeskacem
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Put your Apple team id here (or pick it in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"

targets:
  MotoDash:
    type: application
    platform: iOS
    sources:
      - path: MotoDash
      - path: Shared
    dependencies:
      - target: MotoDashWidgets
    info:
      path: Plists/MotoDash.plist
      properties:
        CFBundleDisplayName: MotoDash
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Keeps the app alive and tracking when you leave it or lock the phone.
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: MotoDash uses your location to measure speed and distance while you ride.
        NSLocationAlwaysAndWhenInUseUsageDescription: MotoDash keeps measuring speed and distance in the background while you ride, and can restart itself if iOS closes it.
        # Dynamic Island / Lock Screen Live Activity
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elyeskacem.motodash
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

  MotoDashWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MotoDashWidgets
      - path: Shared
    info:
      path: Plists/MotoDashWidgets.plist
      properties:
        CFBundleDisplayName: MotoDash
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elyeskacem.motodash.widgets
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
